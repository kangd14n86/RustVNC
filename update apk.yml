name: Build RustVNC APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RustVNC
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Configure Android NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ndk.dir=$SDK/ndk/$NDK_VERSION" >> local.properties
          echo "sdk.dir=$SDK" >> local.properties

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build Rust libraries and APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Show APK output
        if: success()
        run: find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RustVNC-Android-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14